          <g transform="translate(296)"><rect width="282" height="172" rx="7" fill="#E4E9FF" stroke="#C1C7DE"/><rect width="4" height="172" rx="2" fill="#3158DF"/><text x="17" y="24" fill="#777A73" font-family="monospace" font-size="8">C01 / W0–58</text><circle cx="251" cy="21" r="10" fill="#3158DF"/><text x="251" y="24" text-anchor="middle" fill="white" font-family="monospace" font-size="7">2</text><text x="17" y="56" fill="#4F524C" font-family="Georgia" font-size="11">Trust during a high-pressure incident is</text><rect x="17" y="43" width="29" height="17" fill="#E9BB43" fill-opacity=".45"/><rect x="102" y="43" width="83" height="17" fill="#E9BB43" fill-opacity=".45"/><text x="17" y="76" fill="#4F524C" font-family="Georgia" font-size="11">earned before the incident starts. Across</text><text x="17" y="96" fill="#4F524C" font-family="Georgia" font-size="11">eleven interviews, experienced operators…</text><text x="17" y="150" fill="#777A73" font-family="monospace" font-size="7">59 WORDS · ~79 TOK</text><path d="M211 149H265" stroke="#CBC7BC" stroke-width="2"/><path d="M211 149H247" stroke="#3158DF" stroke-width="2"/></g>
